name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

env:
  LOCAL_IMAGE: stratum-materialization:${{ github.sha }}
  RUN_IMAGE_ARCHIVE: tmp/materialization-image.tar

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Log in to the materialization registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Restore the accepted commit image
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/materialization"
          remote_image="$repository:git-$GITHUB_SHA"
          docker pull "$remote_image"
          docker tag "$remote_image" "$LOCAL_IMAGE"
          ./tools/image.sh restore "$LOCAL_IMAGE" "$GITHUB_SHA"
          ./tools/check-generated.sh
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.RUN_IMAGE_ARCHIVE }}
          key: release-image-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Export the commit image for this release
        run: |
          mkdir -p "$(dirname "$RUN_IMAGE_ARCHIVE")"
          docker save "$LOCAL_IMAGE" -o "$RUN_IMAGE_ARCHIVE"

  tests:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.RUN_IMAGE_ARCHIVE }}
          key: release-image-${{ github.run_id }}-${{ github.run_attempt }}
      - run: docker load -i "$RUN_IMAGE_ARCHIVE" && ./tools/image.sh restore "$LOCAL_IMAGE" "$GITHUB_SHA"
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.0.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'
          cache: sbt
      - uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1
      - run: cargo build --release --manifest-path host-rust/Cargo.toml
      - env:
          STRATUM_SKIP_FOUNDATION_TRANSCRIPTS: 1
        run: >-
          sbt -batch
          'testOnly stratum.CanonSuite stratum.HostCoreSuite stratum.NativeBoundarySuite stratum.RunbookSuite stratum.TranscriptSuite'
          repoTool/test

  parity:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        shard: ['0/4', '1/4', '2/4', '3/4']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.RUN_IMAGE_ARCHIVE }}
          key: release-image-${{ github.run_id }}-${{ github.run_attempt }}
      - run: docker load -i "$RUN_IMAGE_ARCHIVE" && ./tools/image.sh restore "$LOCAL_IMAGE" "$GITHUB_SHA"
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.0.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'
          cache: sbt
      - uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1
      - run: cargo build --release --manifest-path host-rust/Cargo.toml
      - env:
          STRATUM_PARITY_SHARD: ${{ matrix.shard }}
        run: ./tools/parity.sh

  cleanroom:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.RUN_IMAGE_ARCHIVE }}
          key: release-image-${{ github.run_id }}-${{ github.run_attempt }}
      - run: docker load -i "$RUN_IMAGE_ARCHIVE" && ./tools/image.sh restore "$LOCAL_IMAGE" "$GITHUB_SHA"
      - run: cargo build --release --manifest-path host-rust/Cargo.toml
      - run: ./tools/cleanroom.sh

  distribution:
    needs: [image, tests, parity, cleanroom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.0.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'
          cache: sbt
      - uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1

      - name: Verify tag and build distribution
        env:
          STRATUM_VERSION: ${{ github.ref_name }}
        run: |
          case "$STRATUM_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release tags must look like v1.2.3" >&2; exit 1 ;;
          esac
          STRATUM_VERSION="${STRATUM_VERSION#v}"
          export STRATUM_VERSION
          sbt -batch distribution
          sha256sum "target/stratum-$STRATUM_VERSION.zip" > "target/stratum-$STRATUM_VERSION.zip.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            target/stratum-*.zip
            target/stratum-*.zip.sha256