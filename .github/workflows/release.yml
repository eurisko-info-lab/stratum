name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Build the independent host
        run: cargo build --release --manifest-path host-rust/Cargo.toml

      - name: Verify tag and build distribution
        env:
          STRATUM_VERSION: ${{ github.ref_name }}
        run: |
          case "$STRATUM_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release tags must look like v1.2.3" >&2; exit 1 ;;
          esac
          STRATUM_VERSION="${STRATUM_VERSION#v}"
          export STRATUM_VERSION
          ./tools/staircase.sh
          ./tools/deployment.sh
          sbt -batch test
          ./tools/parity.sh
          ./tools/cleanroom.sh
          sbt -batch distribution
          sha256sum "target/stratum-$STRATUM_VERSION.zip" > "target/stratum-$STRATUM_VERSION.zip.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/stratum-*.zip
            target/stratum-*.zip.sha256
