name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.0.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'
          cache: sbt

      - uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1

      - name: Build the independent host
        run: cargo build --release --manifest-path host-rust/Cargo.toml

      - name: Verify tag and build distribution
        env:
          STRATUM_VERSION: ${{ github.ref_name }}
        run: |
          case "$STRATUM_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release tags must look like v1.2.3" >&2; exit 1 ;;
          esac
          STRATUM_VERSION="${STRATUM_VERSION#v}"
          export STRATUM_VERSION
          ./tools/staircase.sh
          ./tools/deployment.sh
          sbt -batch test repoTool/test
          ./tools/parity.sh
          ./tools/cleanroom.sh
          sbt -batch distribution
          sha256sum "target/stratum-$STRATUM_VERSION.zip" > "target/stratum-$STRATUM_VERSION.zip.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            target/stratum-*.zip
            target/stratum-*.zip.sha256
