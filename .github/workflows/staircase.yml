name: staircase

on:
  push:
  pull_request:

jobs:
  staircase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.0.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'
          cache: sbt

      - uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1

      - name: Build the independent host
        run: cargo build --release --manifest-path host-rust/Cargo.toml

      - name: Rebuild every foundation in order
        run: ./tools/staircase.sh

      - name: Rebuild every application deployment
        run: ./tools/deployment.sh

      - name: Elaborate the shared language libraries
        run: |
          # No world on this branch builds these, so nothing else would notice
          # if a shared library stopped elaborating. The drift gate below then
          # catches any change to what they elaborate to.
          for source in languages/service/service.meta languages/pdf/pdf.meta; do
            sbt -batch "runMain stratum.cli.Stratum meta elaborate \
              --grammar languages/meta/meta.generated.grammar \
              --program languages/meta/prelude.meta \
              --program languages/meta/elaborate.meta \
              --program languages/grammar/elaborate.meta \
              --source $source --out ${source%.meta}.generated.meta"
          done

      - name: Fail on any drift from the committed artifacts
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "rebuilding the staircase changed committed artifacts:" >&2
            git status --porcelain >&2
            exit 1
          fi

      - name: Replay every transcript and run every suite
        run: sbt -batch test repoTool/test

      - name: Two host parity
        run: ./tools/parity.sh

      - name: Clean room reconstruction
        run: ./tools/cleanroom.sh

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: verifier-lean
          build: true
          test: false
          lint: false
