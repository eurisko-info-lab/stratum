name: seed materialization image

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact Git revision to materialize
        required: true
        type: string
      source_only_checkpoint:
        description: Rebuild the source-only migration checkpoint from scratch
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: materialization-image-seed
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 2

      - name: Log in to the materialization registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - id: image
        name: Find the commit image
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/materialization"
          revision=$(git rev-parse HEAD)
          child_image="$repository:git-$revision"
          if docker pull "$child_image" >/dev/null 2>&1; then
            echo 'hit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'hit=false' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.image.outputs.hit != 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.0.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'
          cache: sbt

      - if: steps.image.outputs.hit != 'true'
        uses: sbt/setup-sbt@bfea3c5f48abd221b04a6df4798aa5eb8b6a2baf # v1

      - if: steps.image.outputs.hit != 'true'
        name: Advance one commit
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/materialization"
          revision=$(git rev-parse HEAD)
          child_image="$repository:git-$revision"

          if [[ '${{ inputs.source_only_checkpoint }}' == 'true' ]]; then
            checkpoint=94072ff4252d923751f44de53f0a3fe8a12c03a9
            if [[ "$revision" != "$checkpoint" ]]; then
              echo "source-only checkpoint is restricted to $checkpoint" >&2
              exit 1
            fi

            ./tools/image.sh clear
            mkdir -p applications
            ./tools/regenerate.sh
            ./tools/staircase.sh
            ./tools/image.sh build "$child_image"
          else
            if parent=$(git rev-parse HEAD^ 2>/dev/null); then
              ancestor=
              while IFS= read -r candidate; do
                candidate_image="$repository:git-$candidate"
                if docker pull "$candidate_image"; then
                  ancestor=$candidate
                  ancestor_image=$candidate_image
                  break
                fi
              done < <(git rev-list "$parent")
              [[ -n "$ancestor" ]] || {
                echo "no ancestor materialization image is available" >&2
                exit 1
              }
              ./tools/advance-image.sh "$child_image" "$ancestor_image" "$ancestor"
            else
              ./tools/advance-image.sh "$child_image"
            fi
          fi

          ./tools/image.sh restore "$child_image" "$revision"
          docker push "$child_image"